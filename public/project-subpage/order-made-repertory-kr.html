      <h1 class="sub_title kr"><strong class="bold-text-3">전통의 틀을 깨고 새롭게 맞춰 입히다.</strong></h1>
      <div class="intro-text-container">
        <div class="text-block-2 kr">기존 전통 공연을 ‘기성복’으로 비유한다면, 오더메이드 레퍼토리는 현대적 감각을 덧입힌 ‘맞춤복’이라 할 수 있다. 경기소리꾼 이희문은 이를 통해 고정된 전통공연의 형식에서 벗어나 동시대의 흐름을 반영하고, 창작자의 개성과 시대적 변화를 적극적으로 반영하는 새로운 형태의 공연을 선보인다.</div>
