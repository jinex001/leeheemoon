  <style>
  #rotation-id {
    transition: transform 0.8s ease;
    transform-style: preserve-3d;
    touch-action: pan-y;
  }
</style>
  <script>
  document.addEventListener("DOMContentLoaded", function () {
    var current_rotation = 0;
    var angle = 360 / 14;
    var rotation = document.querySelector("#rotation-id");
    var nextButton = document.querySelector("#next-button");
    var prevButton = document.querySelector("#prev-button");
    if (!rotation) return;
    function rotateNext() {
      current_rotation -= angle;
      rotation.style.transform = "rotateY(" + current_rotation + "deg)";
    }
    function rotatePrev() {
      current_rotation += angle;
      rotation.style.transform = "rotateY(" + current_rotation + "deg)";
    }
    if (nextButton) {
      nextButton.addEventListener("click", rotateNext);
    }
    if (prevButton) {
      prevButton.addEventListener("click", rotatePrev);
    }
    // Mobile swipe support
    var startX = 0;
    var startY = 0;
    var isSwiping = false;
    var threshold = 40;
    rotation.addEventListener("touchstart", function (e) {
      startX = e.touches[0].clientX;
      startY = e.touches[0].clientY;
      isSwiping = true;
    }, { passive: true });
    rotation.addEventListener("touchend", function (e) {
      if (!isSwiping) return;
      var endX = e.changedTouches[0].clientX;
      var endY = e.changedTouches[0].clientY;
      var diffX = endX - startX;
      var diffY = endY - startY;
      // Ignore vertical scroll gestures
      if (Math.abs(diffX) > Math.abs(diffY) && Math.abs(diffX) > threshold) {
        if (diffX < 0) {
          rotateNext();
        } else {
          rotatePrev();
        }
      }
      isSwiping = false;
    }, { passive: true });
  });
</script>
